name: Contribution Breakout
on:
  workflow_dispatch:
  schedule:
    - cron: "27 19 * * *"
permissions:
  contents: write
concurrency:
  group: github-breakout
  cancel-in-progress: false
jobs:
  breakout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate from real contributions
        uses: cyprieng/github-breakout@v1
        with:
          github_username: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_path: ./breakout/
          paddle_color: "#38bdf8"
          ball_color: "#7dd3fc"
          bricks_colors: "#12243b,#164e73,#0e7490,#38bdf8,#bae6fd"
      - name: Commit breakout images without touching other sections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add breakout/
          if ! git diff --cached --quiet; then
            git commit -m "Update sky-blue contribution breakout"
            git pull --rebase
            git push
          fi
