name: Language radar
on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * 1'
  push:
    paths:
      - scripts/language_radar.py
      - .github/workflows/language-radar.yml
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate radar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/language_radar.py
      - name: Publish radar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/language-radar.svg
          git diff --cached --quiet || (git commit -m 'chore: refresh language radar' && git push)
