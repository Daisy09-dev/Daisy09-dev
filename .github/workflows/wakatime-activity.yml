name: Coding Activity (WakaTime)
on:
  workflow_dispatch:
  schedule:
    - cron: "11 20 * * 1"
permissions:
  contents: write
jobs:
  waka:
    if: ${{ vars.ENABLE_WAKATIME == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true
          SECTION_NAME: waka
          TIME_RANGE: last_7_days
