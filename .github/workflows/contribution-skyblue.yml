name: Sky Blue Contribution Snake
on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
permissions:
  contents: write
concurrency:
  group: sky-blue-snake
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake from real GitHub contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%2338bdf8&color_dots=%23ebedf0,%239be7ff,%235bc5ef,%232b9acb,%23076a9c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2338bdf8&color_dots=%23101827,%2312334d,%2317638a,%232196c4,%237dd3fc
      - name: Publish snake assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
