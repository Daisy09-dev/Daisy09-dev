name: Sky Blue Contribution Snake
on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    paths:
      - 'scripts/decorate_snake.py'
      - '.github/workflows/contribution-skyblue.yml'
permissions:
  contents: write
concurrency:
  group: sky-blue-snake
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake from real GitHub contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#38bdf8&color_dots=#ebedf0,#9be7ff,#5bc5ef,#2b9acb,#076a9c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#101827,#12334d,#17638a,#2196c4,#7dd3fc
      - name: Add long snake body, expressive head and companion
        run: python3 scripts/decorate_snake.py
      - name: Publish snake assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
